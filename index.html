    "content": "# What AI Actually Does (and Doesn't Do)\n\nLet's start with what you actually need to understand \u2014 not the marketing pitch, not the doomsday scenario, but the mechanical reality of what these tools do.\n\n## How Large Language Models Work\n\nWhen you type a question into ChatGPT, Claude, or any other AI assistant, you're interacting with what's called a **large language model** (LLM). Here's what's happening under the hood, in terms a litigator can appreciate:\n\nThe model has been trained on enormous quantities of text \u2014 books, websites, articles, court filings, legal treatises, and much more. During training, the system learned statistical patterns in that text. Specifically, it learned to predict what word (or token) is most likely to come next, given all the words that came before it.\n\nThat's it. That's the core mechanism.\n\nWhen you ask an LLM to \"explain the doctrine of promissory estoppel,\" it isn't retrieving a stored definition from a database. It's generating text, one word at a time, by predicting what words are statistically likely to follow in a sequence that started with your prompt. It has seen thousands of explanations of promissory estoppel during training, so it produces something that reads like a competent explanation \u2014 because it's drawing on the statistical patterns of competent explanations.\n\nThis distinction matters enormously. **The model doesn't \"know\" anything in the way you know things.** It doesn't have beliefs, understanding, or judgment. It has patterns.\n\n## What \"Hallucination\" Really Means\n\nYou've heard the term. You may have heard about lawyers who got burned by it. But understanding *why* hallucination happens will change how you use these tools.\n\nBecause LLMs work by predicting plausible next words, they will sometimes generate text that is fluent, confident, and entirely wrong. The model isn't lying \u2014 it has no concept of truth. It's producing sequences that *pattern-match* to what a correct answer looks like.\n\nConsider this analogy: imagine a very well-read law clerk who has skimmed every case ever published but never actually practiced law and has no access to a library. Ask that clerk to write a memo, and they'll produce something that *sounds* like a memo from a good firm. The structure will be right. The reasoning will be plausible. But some of the citations might be fabricated \u2014 not because the clerk is dishonest, but because they're reconstructing from memory what a citation in that context *should look like*.\n\nThis is precisely what happened in **Mata v. Avianca, No. 22-cv-1461 (S.D.N.Y. 2023)** \u2014 a case we'll examine in detail in Module 2. The attorneys asked ChatGPT for supporting case law, and the model generated citations that looked real, with plausible case names, reporter volumes, and page numbers. None of them existed. The model wasn't trying to deceive; it was doing exactly what it was designed to do: predict plausible text.\n\nHallucination rates have improved significantly since 2023, but they have not been eliminated. As of mid-2025, even the best models still hallucinate, particularly when asked about specific citations, niche legal doctrines, or recent developments that postdate their training data.\n\n## The Training Data Concept\n\nEvery LLM has a **knowledge cutoff** \u2014 a date beyond which it has no training data. If you ask about a case decided after that date, the model either won't know about it or will confabulate an answer based on patterns from older cases.\n\nMore importantly, training data is not comprehensive or curated the way Westlaw or Lexis is. Models are trained on whatever text was available in their training corpus. That means:\n\n- **Coverage is uneven.** Major federal circuit opinions are well-represented. Unpublished state court decisions are not.\n- **Accuracy isn't guaranteed at the source.** The training data includes law review articles, blog posts, and forum discussions \u2014 some excellent, some wrong.\n- **The model can't distinguish authority.** It doesn't inherently know that a Supreme Court opinion carries more weight than a dissent in a district court case. It may generate text that treats them equivalently.\n\n## What AI Is Actually Good At\n\nNone of this means AI is useless. It means you need to deploy it where its strengths align with your needs. LLMs excel at:\n\n- **Pattern recognition and synthesis.** Give the model a set of facts and ask it to identify potential legal issues. It's remarkably good at spotting patterns across large bodies of text \u2014 often catching issues a tired associate might miss.\n- **Drafting and language tasks.** First drafts of memos, emails, demand letters, and motions. The model produces clean, well-structured prose quickly. You add the judgment.\n- **Summarization.** Condensing lengthy deposition transcripts, regulatory filings, or contract provisions into digestible summaries.\n- **Translation between registers.** Converting complex legal analysis into plain-English client communications, or translating technical jargon from expert reports into language a jury would understand.\n- **Brainstorming and ideation.** Generating lists of potential arguments, counterarguments, or analogous areas of law you might not have considered.\n\n## The Right Mental Model\n\nHere's the framework that will serve you throughout this course and beyond:\n\n**Think of AI as a very capable but unreliable research assistant.**\n\nThis assistant is fast, tireless, and has read more than any human could in a lifetime. They can produce first drafts in minutes that would take hours. They can synthesize complex material and spot patterns you might miss.\n\nBut this assistant also makes things up when they don't know the answer. They never say \"I'm not sure.\" They present everything with the same confident tone, whether it's black-letter law or pure fabrication. They have no judgment about what matters and what doesn't. And they will never, ever tell you when they're wrong.\n\nThat last point is critical. **The burden of verification always falls on you.** The model will not flag its own errors. It will not caveat its hallucinations. It will present fabricated citations with the same formatting and confidence as real ones.\n\nThis isn't a reason to avoid AI. It's a reason to use it with the same professional discipline you bring to everything else. You wouldn't file a brief written by a first-year associate without reviewing it. You wouldn't accept a client's version of events without investigating. Apply that same standard here.\n\nThe lawyers who get in trouble with AI are the ones who treat it as an oracle. The lawyers who benefit from it are the ones who treat it as a tool \u2014 powerful, useful, and requiring supervision.\n\nIn the next module, we'll examine exactly what your ethical obligations are when you use that tool."

    "description": "A detailed walk-through of the ABA Model Rules, Formal Opinion 512, the Mata v. Avianca sanctions, and the evolving state bar and federal court disclosure requirements governing lawyer use of AI.",
    "content": "# The Ethics You Can't Ignore\n\nIf Module 1 was about understanding the technology, this module is about understanding your obligations. The ethical landscape around AI in legal practice has developed rapidly since 2023, and ignorance is not a defense \u2014 in fact, as we'll see, it's the opposite.\n\n## ABA Model Rule 1.1: Competence Now Includes AI\n\nModel Rule 1.1 requires that lawyers provide competent representation, defined as \"the legal knowledge, skill, thoroughness and preparation reasonably necessary for the representation.\"\n\nComment 8 to Rule 1.1, amended in 2012, added a requirement that has taken on new significance: lawyers must \"keep abreast of changes in the law and its practice, **including the benefits and risks associated with relevant technology.**\"\n\nIn 2012, this comment was primarily aimed at e-discovery and cybersecurity. In 2025, it unambiguously encompasses AI. The duty of competence now requires you to understand \u2014 at least at a functional level \u2014 what AI tools can and cannot do. Not because you must use them, but because you must be able to make informed decisions about whether and how to use them.\n\nThis cuts both ways. A lawyer who blindly relies on AI-generated research without verification has failed the competence standard. But a lawyer who categorically refuses to learn about AI tools that could materially benefit client representation may also fall short \u2014 particularly as these tools become standard practice.\n\n**The practical takeaway:** You don't need to become a technologist. You need to understand enough to exercise professional judgment about AI \u2014 which is exactly what this course is designed to give you.\n\n## ABA Model Rule 1.6: The Confidentiality Problem\n\nRule 1.6(a) provides that a lawyer \"shall not reveal information relating to the representation of a client unless the client gives informed consent.\" Rule 1.6(c) requires lawyers to \"make reasonable efforts to prevent the inadvertent or unauthorized disclosure of, or unauthorized access to, information relating to the representation.\"\n\nHere is where it gets concrete: **when you paste client facts into an AI tool, you may be disclosing confidential information to a third party** \u2014 the AI provider.\n\nThe analysis depends on the specific tool and configuration:\n\n- **Consumer AI tools** (free ChatGPT, free Claude, Google's consumer Gemini): These services typically retain user inputs for model training and improvement. Their terms of service generally grant the provider broad rights to use your input data. Entering client information into these tools is, in most analyses, an unauthorized disclosure under Rule 1.6. Full stop.\n\n- **Enterprise/business AI tools** (ChatGPT Enterprise or Team, Claude for Business, Microsoft Copilot for enterprise): These typically offer contractual commitments that user data will not be used for training, will not be accessible to other users, and will be subject to data retention limitations. Many also offer data processing agreements (DPAs) and SOC 2 compliance.\n\n- **On-premise or private deployments**: Some firms run models locally or through private cloud instances where data never leaves the firm's control. This eliminates the third-party disclosure issue entirely.\n\n**The practical framework:** Before entering any client data into an AI tool, you need to understand (1) who has access to that data, (2) whether it's retained and for how long, (3) whether it's used for model training, and (4) whether the provider's data handling meets the \"reasonable efforts\" standard under Rule 1.6(c). If you can't answer these questions, you can't use that tool with client data.\n\n## ABA Model Rules 5.1 and 5.3: Supervision Duties\n\nRule 5.1 addresses supervisory responsibilities of partners and senior lawyers. Rule 5.3 addresses responsibilities regarding non-lawyer assistants: a lawyer with supervisory authority must \"make reasonable efforts to ensure that the person's conduct is compatible with the professional obligations of the lawyer.\"\n\nThe ABA has made clear that AI should be treated under the same supervisory framework as a non-lawyer assistant. You wouldn't let a paralegal file a brief you hadn't reviewed. The same standard applies to AI-generated work product.\n\nThis has implications for firm management as well. Partners and managing attorneys have an obligation under Rule 5.1 to establish \"reasonable measures\" to ensure that lawyers in the firm are using AI in compliance with the Rules of Professional Conduct. In practice, this means firms need AI use policies \u2014 not as a bureaucratic exercise, but as a professional obligation.\n\n## ABA Formal Opinion 512 (July 29, 2024)\n\nThis is the ABA's first formal ethics opinion directly addressing generative AI, and it deserves careful attention. The opinion addresses several key principles:\n\n**1. The duty to understand.** The opinion states explicitly that the duty of competence under Rule 1.1 requires lawyers to understand the capabilities and limitations of AI tools they use. Lawyers need not become technical experts, but they must understand enough to use these tools responsibly.\n\n**2. Mandatory supervision of output.** Lawyers must review and verify all AI-generated work product before relying on it or submitting it. The opinion specifically warns about hallucinated citations and fabricated legal authorities. AI output must be treated as a draft requiring human verification, not as a finished product.\n\n**3. Confidentiality protections.** Consistent with Rule 1.6, the opinion emphasizes that lawyers must evaluate the data privacy practices of any AI tool before using it with client information. The opinion distinguishes between consumer tools (generally unsuitable for client data) and enterprise tools with appropriate safeguards.\n\n**4. Disclosure obligations.** The opinion notes that lawyers may need to disclose their use of AI to clients, particularly when it materially affects the representation. This is rooted in Rule 1.4 (Communication) \u2014 clients are entitled to information relevant to how their matter is being handled.\n\n**5. Billing implications.** This is the provision that got the most attention. The opinion states that lawyers should not charge clients for time that AI has eliminated. If AI reduces a task from three hours to thirty minutes, billing three hours raises serious questions under Rule 1.5 (Fees). The opinion suggests that value-based or task-based billing may be more appropriate than hourly billing for AI-assisted work. Some practitioners are adapting by billing for the professional judgment applied to AI output rather than the raw time spent.\n\n## Mata v. Avianca: The Cautionary Tale\n\nNo discussion of AI ethics in law is complete without **Mata v. Avianca, Inc., No. 22-cv-1461 (S.D.N.Y. 2023)**.\n\nThe facts: Attorneys Steven Schwartz and Peter LoDuca of the firm Levidow, Levidow & Oberman submitted a legal brief in an aviation personal injury case that cited six cases as authority. None of the cases existed. They had been generated by ChatGPT. When opposing counsel and the court could not locate the cases, Schwartz submitted an affidavit \u2014 along with printouts from ChatGPT appearing to confirm the cases were real. He had asked ChatGPT whether the cases were real, and the model had assured him they were.\n\nJudge P. Kevin Castel imposed sanctions of $5,000 on each attorney. In his June 22, 2023 order, Judge Castel wrote that the attorneys \"abandoned their responsibilities when they submitted non-existent judicial opinions with fake quotes and fake internal citations\" and that they had acted in \"bad faith\" by continuing to stand behind the fabricated citations after being questioned.\n\nThe critical lesson isn't just \"verify your citations.\" It's that **the model will confidently confirm its own fabrications if you ask it.** Schwartz's mistake was not just using ChatGPT for research \u2014 it was using ChatGPT to verify ChatGPT. The verification must come from authoritative, independent sources: Westlaw, Lexis, official court records.\n\n## State Bar Guidance and Federal Court Requirements\n\nSince Mata v. Avianca, the regulatory landscape has accelerated:\n\n- **State bar guidance:** Numerous state bars have issued formal guidance or ethics opinions on AI use, including California, New York, Florida, Texas, New Jersey, and others. While the specifics vary, common threads include the duty to verify AI output, protect client confidentiality, and maintain supervision. Several states now include AI competence in their CLE requirements.\n\n- **Federal court standing orders:** As of early 2026, a significant number of federal judges across multiple districts have issued standing orders or local rules requiring attorneys to disclose when AI tools were used in preparing filings. Some require certification that all citations have been independently verified. The specifics vary by court and judge, but the trend is clear and accelerating. Before filing in any federal court, check whether the assigned judge has an AI disclosure requirement.\n\n- **State court developments:** Several state court systems have adopted or proposed similar disclosure rules, though adoption is less uniform than in federal courts.\n\n**The bottom line:** The ethical framework is not ambiguous. You must understand the tools, supervise the output, protect client data, and be transparent about your use of AI. These aren't aspirational suggestions \u2014 they're professional obligations with real consequences for non-compliance.\n\nNow that you understand both the technology and the rules, let's talk about how to put AI to work \u2014 responsibly."
  },

    "number": 3,
    "title": "Five Things AI Can Do for You This Week",
    "description": "Five practical, low-risk AI use cases for practicing attorneys \u2014 each with an explanation, a sample prompt you can adapt today, and a reminder of the verification step.",
    "content": "# Five Things AI Can Do for You This Week\n\nTheory is useful. Practice is better. This module gives you five concrete ways to start using AI in your legal work \u2014 not next quarter, not after a firm-wide rollout, but this week. Each use case includes an explanation, a sample prompt you can steal and adapt, and the verification step you must not skip.\n\nA threshold reminder: as we discussed in Module 2, use an enterprise-grade AI tool with appropriate data protections for any work involving client information. The prompts below are tool-agnostic \u2014 they'll work in ChatGPT (Team or Enterprise), Claude (Pro or Business), or similar platforms.\n\n## 1. Legal Research Assistance\n\n**What it does well:** AI is excellent at brainstorming legal theories, identifying analogous areas of law, generating research roadmaps, and helping you think through the universe of potentially relevant authority. It can help you find the arguments you haven't considered yet.\n\n**What it does NOT replace:** Westlaw, Lexis, or any citator service. AI is your brainstorming partner for the research plan; your legal database is where you execute that plan and verify every authority.\n\n**Sample prompt:**\n\n> I'm representing a small business owner in Colorado who signed a non-compete agreement with her former employer. The non-compete restricts her from operating any competing business within a 50-mile radius for 3 years. She believes the scope is unreasonable.\n>\n> Acting as a senior associate specializing in employment law, please:\n> 1. Outline the key legal standards Colorado courts apply when evaluating the enforceability of non-compete agreements\n> 2. Identify the strongest arguments for challenging this specific non-compete as overbroad\n> 3. Suggest analogous cases or legal theories I should research, including any recent legislative changes in Colorado regarding non-competes\n> 4. Flag any procedural considerations I should be aware of\n>\n> Note: I will independently verify all legal authorities you reference. Please indicate where you are less certain about specific citations.\n\n**Why this works:** You've given the model a clear fact pattern, a specific jurisdiction, a defined role, and explicit instructions. The last line is important \u2014 it primes the model to be more careful and to flag uncertainty, even though you're going to verify everything regardless.\n\n**Verification step:** Every case name, statute, and legal standard mentioned must be independently confirmed through Westlaw, Lexis, or official sources. Pay special attention to any claim about \"recent\" legislative changes \u2014 this is where hallucination risk is highest.\n\n## 2. First-Draft Generation\n\n**What it does well:** AI can produce structurally sound first drafts of memos, client letters, demand letters, and routine motions in a fraction of the time it would take to write from scratch. The draft gives you a framework to refine \u2014 you add the judgment, the strategy, and the nuance.\n\n**Sample prompt:**\n\n> Draft an internal research memo analyzing whether our client, a commercial landlord in Texas, can pursue an unlawful detainer action against a tenant who has remained in possession after lease expiration but claims they exercised a renewal option. Key facts:\n>\n> - Original lease term: 5 years, expired March 31, 2026\n> - Lease contains a renewal option clause in Section 12.3, which requires written notice \"no later than 180 days before expiration\"\n> - Tenant sent renewal notice on November 15, 2025 (137 days before expiration)\n> - Landlord contends notice was untimely\n> - Tenant contends \"no later than 180 days\" means any time up to 180 days before, not exactly 180 days or more\n>\n> Format: standard research memo with Issue, Brief Answer, Discussion, and Conclusion sections. Texas law applies. Approximately 1,500 words.\n\n**Why this works:** You've provided the specific facts, the legal question, the jurisdiction, and the desired format. The model can produce a well-organized draft that you then verify, refine, and make your own.\n\n**Verification step:** Check every legal authority cited. Scrutinize the reasoning \u2014 does it accurately characterize the holdings of the cases it references? Does the analysis account for any relevant distinctions? Add your own strategic judgment about which arguments to emphasize.\n\n## 3. Contract Review and Issue Spotting\n\n**What it does well:** AI can quickly scan contracts and flag provisions that are non-standard, one-sided, missing, or potentially problematic. It's particularly effective for routine commercial contracts where you know what standard terms look like and need a fast way to identify deviations.\n\n**Sample prompt:**\n\n> I'm reviewing the attached SaaS subscription agreement from the vendor's perspective. My client is the subscribing company (a mid-size healthcare provider). Please:\n>\n> 1. Identify any terms that are unusually favorable to the vendor or potentially problematic for the subscriber\n> 2. Flag any provisions related to data privacy, data ownership, or data portability, and assess whether they're adequate for a healthcare client that may handle PHI\n> 3. Note any standard protective provisions that appear to be missing (e.g., SLA commitments, limitation of liability, indemnification, termination for convenience)\n> 4. Highlight any ambiguous language that could lead to disputes\n> 5. For each issue identified, suggest specific alternative language or negotiating points\n>\n> Organize your analysis by risk level: high, medium, and low.\n\n**Why this works:** You've specified the client's position (subscriber, not vendor), the industry context (healthcare/PHI), and a clear analytical framework. The risk-level organization makes the output immediately actionable for triage.\n\n**Verification step:** AI may miss jurisdiction-specific requirements (for instance, state-level data privacy laws that impose additional obligations). It may also miss context-specific issues that depend on your client's particular business operations. Use the AI output as a checklist to supplement \u2014 not replace \u2014 your own review.\n\n## 4. Document Summarization\n\n**What it does well:** This may be the single highest-ROI use case for most practicing lawyers. AI can digest lengthy documents \u2014 deposition transcripts, regulatory filings, due diligence materials, expert reports \u2014 and produce concise, organized summaries. For attorneys handling document-intensive matters, this can reclaim hours of review time.\n\n**Sample prompt:**\n\n> I'm attaching the deposition transcript of Dr. James Whitfield, the plaintiff's treating physician in a medical malpractice case. Please provide:\n>\n> 1. A one-paragraph executive summary of the key testimony\n> 2. A chronological summary of the medical treatment described, including specific dates, procedures, and outcomes mentioned\n> 3. All statements Dr. Whitfield made regarding the standard of care and whether it was met\n> 4. Any concessions or admissions that could be favorable to the defense\n> 5. Any inconsistencies or areas where the testimony was vague or evasive\n> 6. Key quotes with transcript page and line references that I should flag for potential use at trial or in briefing\n>\n> Format the output with clear headers and bullet points. Prioritize accuracy over brevity \u2014 I need specific details, not generalities.\n\n**Why this works:** You've asked for specific categories of information rather than a generic \"summarize this.\" The request for page-and-line references gives you a roadmap back to the source material.\n\n**Verification step:** Spot-check the page-and-line references against the actual transcript. AI may occasionally misattribute quotes or slightly paraphrase rather than quoting verbatim. For any quote you plan to use in briefing or at trial, go back to the original.\n\n## 5. Client Communication\n\n**What it does well:** Translating complex legal analysis into clear, accessible language for clients is a skill that takes time to develop. AI can accelerate this process dramatically \u2014 taking your legal analysis and converting it into a client-friendly communication that maintains accuracy while eliminating jargon.\n\n**Sample prompt:**\n\n> I need to send an email to my client, the CEO of a mid-size manufacturing company, explaining the results of our motion to dismiss. Here's the situation:\n>\n> - We filed a 12(b)(6) motion to dismiss the plaintiff's tortious interference and breach of fiduciary duty claims\n> - The court granted our motion on the tortious interference claim, finding the plaintiff failed to plead the existence of a valid business expectancy with sufficient specificity\n> - The court denied our motion on the breach of fiduciary duty claim, finding the plaintiff's allegations were sufficient to survive the pleading stage\n> - This means we proceed to discovery on the fiduciary duty claim only\n>\n> Draft an email that:\n> - Explains the outcome in plain English (the client is business-savvy but not a lawyer)\n> - Conveys that this is a partial win \u2014 we eliminated one of the two claims\n> - Briefly explains what discovery means and what the client should expect next\n> - Is professional but warm in tone\n> - Is approximately 300-400 words\n> - Does NOT overstate the significance of either the win or the remaining claim\n\n**Why this works:** You've given the model the substantive legal outcome, the client's profile, the tone you want, and specific guardrails (don't overstate). The result should be close to what you'd send after light editing.\n\n**Verification step:** Read the draft for accuracy \u2014 does it correctly characterize the court's ruling? Does it set appropriate expectations? Does it inadvertently make any promises or predictions about the remaining claim? Would you be comfortable if opposing counsel read this email?\n\n## The Common Thread\n\nNotice what all five use cases share: **AI does the first 60-80% of the work, and your professional judgment does the rest.** The time savings come not from eliminating your involvement, but from eliminating the blank-page problem and the tedious initial drafting.\n\nNotice also what's absent from this list: we're not using AI to make strategic decisions, predict case outcomes, or replace legal judgment. We're using it for what it's good at \u2014 language tasks, pattern recognition, and synthesis \u2014 while keeping human judgment exactly where it needs to be.\n\nIn the next module, we'll go deeper on how to write prompts that get consistently better results."

    "number": 4,
    "title": "Prompting That Actually Works",
    "description": "A practical prompt engineering framework built on the legal IRAC method lawyers already know, with three ready-to-use templates and a guide to the most common prompting mistakes.",
    "content": "# Prompting That Actually Works\n\nMost lawyers who try AI tools and come away unimpressed made the same mistake: they typed in a vague question, got a vague answer, and concluded the technology wasn't useful. The problem wasn't the tool \u2014 it was the prompt.\n\nPrompt quality is the single biggest determinant of output quality. A well-constructed prompt can be the difference between getting unusable filler and getting a draft that needs only light editing. This module gives you a repeatable framework and concrete templates.\n\n## The IRAC-P Framework\n\nYou already know IRAC \u2014 Issue, Rule, Application, Conclusion. It's the backbone of legal analysis, drilled into you since your first semester of law school. We're going to adapt it into a prompting framework that leverages the same structured-thinking habits: **IRAC-P** \u2014 Issue, Role, Action, Context, Parameters.\n\n### I \u2014 Issue\n**What specific question are you trying to answer?**\n\nThe most common prompting mistake is being too broad. \"Tell me about non-compete law\" will give you a law school outline. \"What are the strongest arguments that a 3-year, 50-mile non-compete in Colorado is unenforceable for a hair salon owner?\" will give you something useful.\n\nBe precise. Narrow the issue the same way you would in a research memo. The more specific your question, the more targeted the output.\n\n### R \u2014 Role\n**What role should the AI play?**\n\nLLMs produce meaningfully different output depending on the persona you assign. \"You are a senior litigation associate at an Am Law 100 firm\" produces different work than \"you are a legal writing instructor\" or \"you are a transactional attorney specializing in M&A.\"\n\nThe role setting calibrates the model's tone, depth, vocabulary, and analytical approach. Use it. Some effective role assignments:\n\n- \"You are a senior associate at a litigation firm with 8 years of experience in commercial disputes\"\n- \"You are a contracts attorney reviewing this agreement on behalf of the buyer\"\n- \"You are a legal writing professor providing feedback on a draft brief\"\n- \"You are an employment law specialist advising a mid-size company's HR department\"\n\n### A \u2014 Action\n**What exactly should the AI do?**\n\nUse precise verbs: **summarize, draft, compare, analyze, identify, flag, list, explain, critique, rewrite.** Each verb produces a different type of output.\n\n\"Review this contract\" is vague. \"Identify all indemnification provisions in this contract, assess whether each is mutual or one-sided, and flag any that are unusually broad in scope\" is an action the model can execute.\n\n### C \u2014 Context\n**What background does the AI need?**\n\nThis is where most lawyers under-invest. The model doesn't know your jurisdiction, your practice area, your client's situation, or the procedural posture of your case unless you tell it. Context includes:\n\n- **Jurisdiction** \u2014 state and federal matter enormously. \"California employment law\" and \"Texas employment law\" are different universes.\n- **Practice area and sub-specialty** \u2014 \"commercial real estate\" is more useful than \"real estate\"\n- **Client profile** \u2014 company size, industry, sophistication level\n- **Key facts** \u2014 the specific facts of your matter, to the extent you can share them (remembering your confidentiality obligations from Module 2)\n- **Procedural posture** \u2014 pre-litigation, discovery, summary judgment, appeal\n- **Adversary information** \u2014 what you know about the opposing position\n\n### P \u2014 Parameters\n**What constraints apply?**\n\nParameters are the guardrails that shape the output into something you can actually use:\n\n- **Format** \u2014 memo, email, bullet points, table, outline\n- **Length** \u2014 \"approximately 1,500 words\" or \"keep it under one page\"\n- **Tone** \u2014 formal, client-friendly, persuasive, neutral\n- **Inclusions** \u2014 \"include specific statutory references\" or \"address both state and federal claims\"\n- **Exclusions** \u2014 \"do not address damages\" or \"focus only on liability\"\n- **Audience** \u2014 partner, client, opposing counsel, judge\n\n## Three Templates You Can Use Today\n\n### Template 1: Research Memo\n\n> **Role:** You are a senior associate at a litigation firm specializing in [practice area].\n>\n> **Issue:** I need a research memo analyzing [specific legal question]. The key facts are: [fact summary].\n>\n> **Action:** Draft an internal research memo with the following sections: Issue Presented, Brief Answer, Discussion, and Conclusion.\n>\n> **Context:**\n> - Jurisdiction: [state/federal, specific court if relevant]\n> - Our client is the [plaintiff/defendant/party description]\n> - Procedural posture: [pre-litigation/discovery/motion practice/etc.]\n> - Key opposing argument we need to address: [if known]\n>\n> **Parameters:**\n> - Approximately [word count] words\n> - Cite specific statutes and case law where applicable (I will independently verify all citations)\n> - Address the strongest counterarguments\n> - Flag any areas where the law is unsettled or where there is a circuit split\n> - Indicate your confidence level where relevant\n\n### Template 2: Contract Review\n\n> **Role:** You are a transactional attorney reviewing this [contract type] on behalf of [client's position \u2014 buyer/seller/licensee/etc.].\n>\n> **Action:** Review the attached agreement and provide:\n> 1. An executive summary of the key commercial terms (in a table format)\n> 2. A risk assessment organized by severity (high/medium/low)\n> 3. For each identified risk: the specific provision, why it's problematic, and suggested alternative language\n> 4. A list of standard protective provisions that are missing\n> 5. Any provisions that are ambiguous and could lead to disputes\n>\n> **Context:**\n> - Client industry: [industry]\n> - Deal size/significance: [context]\n> - Client's negotiating leverage: [strong/moderate/limited]\n> - Particular areas of concern: [if any \u2014 e.g., IP ownership, data privacy, termination rights]\n> - Governing law: [jurisdiction]\n>\n> **Parameters:**\n> - Prioritize practical, actionable feedback over theoretical concerns\n> - For suggested alternative language, provide specific redline-ready text\n> - Flag any provisions that may trigger regulatory requirements given the client's industry\n\n### Template 3: Client Communication\n\n> **Role:** You are a [practice area] attorney communicating with [client description \u2014 e.g., \"the CEO of a mid-size technology company\" or \"an individual plaintiff with no legal background\"].\n>\n> **Action:** Draft a [format \u2014 email/letter/memo] that explains [specific legal matter/outcome/recommendation].\n>\n> **Context:**\n> - Here's the legal situation: [factual and legal summary]\n> - The client's primary concern is: [what they care about most]\n> - Client sophistication level: [business-savvy executive / no legal background / etc.]\n> - Relationship context: [new client / long-standing relationship / sensitive matter]\n>\n> **Parameters:**\n> - Approximately [length] words\n> - Plain English \u2014 no legal jargon unless unavoidable (and define any terms you must use)\n> - Tone: [professional and reassuring / direct and candid / urgent]\n> - Do not overstate positive outcomes or minimize risks\n> - Include a clear next-steps section\n> - Do not make predictions about outcomes unless I specify\n\n## Common Mistakes Lawyers Make When Prompting\n\n**1. Being too vague.** \"Review this contract\" gives you a generic, surface-level response. \"Review this SaaS agreement from the subscriber's perspective, focusing on data privacy provisions and liability caps, under California law\" gives you something you can work with.\n\n**2. Not specifying jurisdiction.** The law varies dramatically by jurisdiction. A prompt that doesn't include the relevant jurisdiction will get you a generic, multi-jurisdictional response that may not be accurate for any specific state. Always specify.\n\n**3. Not providing enough context.** The model doesn't know your case unless you tell it. The more relevant facts you provide (consistent with your confidentiality obligations), the more tailored and useful the output.\n\n**4. Trusting output without verification.** We've covered this extensively, but it bears repeating. Every citation, every legal standard, every factual claim in AI output must be independently verified. This is non-negotiable.\n\n**5. Using consumer AI tools with client data.** Free-tier consumer tools typically retain and may use your input for training. As we discussed in Module 2, this likely violates Rule 1.6. Use enterprise tools with appropriate data protections for anything involving client information.\n\n**6. Giving up after one prompt.** The first prompt gets you to about 60% of what you need. The real value comes from follow-up prompts that refine, deepen, and redirect.\n\n## The Iteration Technique\n\nHere's the workflow that experienced AI users follow:\n\n**Prompt 1 \u2014 The Foundation (gets you to ~60%).** Use the IRAC-P framework to set up the task. Get the initial output.\n\n**Prompt 2 \u2014 The Refinement (gets you to ~80%).** \"This is good, but [specific feedback]. Please revise to [specific instruction].\" Or: \"The analysis of [X] is too surface-level. Go deeper on the standard for [specific doctrine] and address the counterargument that [Y].\"\n\n**Prompt 3 \u2014 The Polish (gets you to ~90%).** \"Restructure the memo so that [organizational change]. Strengthen the argument in section [X] by [specific instruction]. Tighten the prose \u2014 eliminate any filler language.\"\n\n**The final 10% is your professional judgment.** That's where you add the strategic insight, the nuance that comes from knowing the judge's tendencies, the tactical awareness of what opposing counsel is likely to argue, and the client-specific context that no model can replicate.\n\nThis iterative approach mirrors how you already work with associates. You assign the task, review the first draft, give feedback, review the revision, and then add your own polish. The only difference is speed \u2014 the cycle that takes days with a human associate takes minutes with AI.\n\nIn the final module, we'll pull everything together into an action plan you can implement immediately."
  },

    "title": "Your AI Action Plan",
    "description": "A practical implementation roadmap covering where to start, how to build verification workflows, how to frame AI adoption internally, and a 5-question personal AI policy for any matter.",
    "content": "# Your AI Action Plan\n\nYou now understand how the technology works, what your ethical obligations are, what AI can do for you in practice, and how to prompt effectively. This final module is about turning knowledge into action \u2014 giving you a clear, low-risk path to start using AI in your practice this week.\n\n## Start with the Low-Risk Quadrant\n\nNot all legal tasks carry the same risk profile. The smart move is to start where three conditions converge:\n\n1. **Errors are easily caught.** You'll review the output before it goes anywhere.\n2. **Consequences of mistakes are low.** An error in an internal brainstorming document is not the same as an error in a filing.\n3. **The productivity gain is high.** Tasks that currently consume significant time but involve routine work.\n\nHere's your starting lineup:\n\n- **Internal memo drafts.** First drafts of research memos that you'll review, edit, and finalize. No one sees these but you and your team. Errors are caught in your normal review process. Time savings: often 40-60% of initial drafting time.\n\n- **Research brainstorming.** Using AI to generate research roadmaps, identify potential arguments, or explore analogous areas of law. You're not relying on the AI's citations \u2014 you're using its ability to think broadly before you dive into Westlaw or Lexis. Time savings: helps ensure you're not missing angles, and cuts planning time.\n\n- **Document summarization.** Condensing deposition transcripts, lengthy contracts, or regulatory filings into structured summaries. You'll spot-check against the originals. Time savings: potentially hours per document on document-intensive matters.\n\n- **Client email drafts.** Translating your legal analysis into client-friendly language. You'll review for accuracy and tone before sending. Time savings: 15-30 minutes per communication, and often better clarity than what you'd draft under time pressure.\n\n- **Internal knowledge management.** Synthesizing firm precedent, creating checklists for recurring matter types, or summarizing changes in relevant law. Time savings: turns a project that never gets done into one that takes an afternoon.\n\nWhat should you **not** start with? Anything filed with a court. Anything sent to opposing counsel without thorough review. Anything involving novel legal questions where getting it wrong has serious consequences. You'll get there eventually, but not on day one.\n\n## The Verification Workflow\n\nEvery piece of AI-generated work product should pass through this five-step process before you rely on it:\n\n**Step 1: AI generates.** You provide a well-structured prompt (Module 4). The model produces a draft.\n\n**Step 2: Lawyer reviews for substance.** Read the output critically. Does the analysis make sense? Is the reasoning sound? Does it address the right issues? Are there gaps or mischaracterizations? At this stage, you're evaluating the work the same way you'd evaluate a draft from a junior associate.\n\n**Step 3: Lawyer verifies citations.** This is non-negotiable. Every case citation, every statute reference, every regulatory citation must be independently verified through Westlaw, Lexis, or official sources. Check not just that the case exists, but that it says what the AI claims it says. Check that it hasn't been overruled or distinguished. Run it through a citator.\n\n**Step 4: Lawyer applies judgment.** This is where you earn your fee. The AI doesn't know your client's business objectives. It doesn't know the judge's tendencies. It doesn't know what opposing counsel argued at the last hearing. It doesn't understand the politics of a deal or the dynamics of a negotiation. You add the strategic layer that transforms a competent draft into effective legal work.\n\n**Step 5: Lawyer takes responsibility.** When you sign that brief, send that email, or present that analysis, it's your work product. The fact that AI assisted in drafting is irrelevant to your professional responsibility. You own it completely \u2014 the good parts and any errors.\n\nPost this workflow where you can see it. Share it with your team. Make it habitual.\n\n## What to Tell Your Partners\n\nIf you're an associate or mid-level attorney considering raising AI adoption with firm leadership, frame it correctly:\n\n**Frame it as competence, not convenience.** ABA Model Rule 1.1, Comment 8, requires lawyers to stay current with relevant technology. ABA Formal Opinion 512 makes clear that AI falls within this obligation. Adopting AI thoughtfully isn't about cutting corners \u2014 it's about meeting your professional duty to understand the tools that are reshaping legal practice.\n\n**Frame it as risk management, not experimentation.** Lawyers at your firm are already using AI \u2014 the question is whether they're using it with appropriate safeguards. A firm AI policy isn't overhead; it's the same kind of risk management that drives your conflicts checks and your document retention policies.\n\n**Frame it with the economics.** A senior associate who uses AI to produce first drafts 40% faster can handle a higher volume of substantive work, spend more time on high-value strategic thinking, and deliver faster turnaround to clients. These aren't theoretical benefits \u2014 they're competitive advantages that clients are beginning to expect.\n\n**Address the billing question directly.** Yes, Formal Opinion 512 indicates lawyers should not charge clients for time AI has eliminated. But the math still works: if AI cuts drafting time on a memo from four hours to one, you've freed up three hours for other billable work or for higher-value activities on the same matter. The net effect on firm revenue depends on how you redeploy the time saved.\n\n## What to Tell Your Clients\n\n**Transparency builds trust.** Some firms have tried to keep AI use quiet. This is a mistake \u2014 both ethically and strategically. Clients are sophisticated. Many are already using AI in their own businesses and will respect a law firm that approaches the technology thoughtfully rather than pretending it doesn't exist.\n\n**Some clients are already asking.** Corporate legal departments, in particular, are inquiring about their outside counsel's AI capabilities. In some cases, demonstrating thoughtful AI adoption is becoming a differentiator in pitches and RFPs. Clients want to know: Are you using modern tools? Do you have safeguards in place? Are you passing efficiency gains on to us?\n\n**What to communicate:**\n- That your firm has evaluated AI tools and adopted enterprise-grade solutions with appropriate data protections\n- That AI assists with certain tasks (drafting, research, summarization) but all work product receives thorough attorney review\n- That the use of AI does not diminish the quality of professional judgment applied to their matters\n- That you have policies in place to protect their confidential information when using AI tools\n\nConsider adding AI disclosure language to your engagement letters. This is increasingly becoming standard practice, and it's far better to address it proactively than to have a client learn about your AI use after the fact.\n\n## Your Personal AI Policy: Five Questions\n\nBefore you use AI on any client matter, run through these five questions. If you can't answer \"yes\" to all five, stop and address the gap.\n\n**1. Does the engagement letter address AI use?**\nIf your engagement letter is silent on AI, consider whether the client's reasonable expectations would encompass AI-assisted work. For new matters, add appropriate disclosure language. For existing matters, consider a supplemental disclosure if AI use is material.\n\n**2. Is the tool's data handling policy acceptable for this client's data?**\nReview the AI provider's terms of service, data processing agreement, and privacy policy. Confirm that client data won't be used for training, won't be accessible to other users, and will be subject to appropriate retention and deletion policies. If the client operates in a regulated industry (healthcare, financial services, government contracting), apply additional scrutiny.\n\n**3. Am I using an enterprise tool, not a consumer tool?**\nConsumer-tier AI products (free ChatGPT, free Claude, etc.) generally do not provide the data protections required under Rule 1.6. Use enterprise or business-tier products that offer contractual data protection commitments. Better yet, use AI tools specifically designed for legal practice that include additional safeguards.\n\n**4. Do I have a verification plan for the output?**\nBefore you prompt, know how you'll verify the result. For research output, you'll run every citation through Westlaw or Lexis. For contract review, you'll cross-check against the original document. For client communications, you'll review for accuracy and appropriate tone. The verification plan should be proportionate to the stakes.\n\n**5. Am I prepared to take full responsibility for the work product?**\nIf something goes wrong \u2014 a citation is fabricated, an analysis is flawed, a provision is missed \u2014 you own it. \"The AI got it wrong\" is not a defense. If you wouldn't sign a filing or send a letter based on the AI's output without your own review and judgment, don't use AI for that task yet.\n\n## Where to Go Deeper\n\nThis minicourse gives you the foundation. If you want structured, accredited training that goes further \u2014 including hands-on workshops, practice-area-specific modules, and CLE credit \u2014 the TVPi offers a full course catalog and the ALPP (AI Literate Legal Professional) accreditation program designed specifically for practicing attorneys. It's worth exploring if you're serious about building this competency systematically.\n\n## The Bottom Line\n\nAI in legal practice is not a future consideration. It's a present reality. The ethical rules are clear. The tools are available. The competitive dynamics are shifting. The question isn't whether AI will affect your practice \u2014 it's whether you'll be in the driver's seat when it does.\n\nThe lawyers who will thrive aren't the ones who use AI first \u2014 they're the ones who learn to use it well.\n\nStart this week. Start small. Start with the low-risk quadrant. Build the verification habit from day one. And apply the same professional discipline to AI that you bring to everything else in your practice.\n\nThat's how you do this right."

// ── Proxy API (Cloudflare Worker keeps PAT server-side) ──
function isAirtableConfigured() {
  return PROXY_URL && PROXY_URL !== 'YOUR_PROXY_URL_HERE';
}

async function airtableCreate(tableId, fields) {
  if (!isAirtableConfigured()) return null;
  try {
    const res = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tableId, fields })
    });
    if (!res.ok) { console.warn('Proxy create failed:', await res.text()); return null; }
    return await res.json();
  } catch(e) { console.warn('Proxy error:', e); return null; }
}

async function airtableUpdate(tableId, recordId, fields) {
  if (!isAirtableConfigured() || !recordId) return null;
  try {
    const res = await fetch(PROXY_URL, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tableId, recordId, fields })
    });
    if (!res.ok) { console.warn('Proxy update failed:', await res.text()); return null; }
    return await res.json();
  } catch(e) { console.warn('Proxy error:', e); return null; }
}

// ── Markdown Renderer ──────────────────────────────────
function renderMarkdown(md) {
  const lines = md.split('\n');
  let html = '';
  let inUl = false, inOl = false, inBlockquote = false;

  function closeLists() {
    if (inUl) { html += '</ul>'; inUl = false; }
    if (inOl) { html += '</ol>'; inOl = false; }
    if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
  }

  function inlineFormat(text) {
    // Bold
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // Inline code
    text = text.replace(/`(.+?)`/g, '<code>$1</code>');
    return text;
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();

    // Blank line
    if (!trimmed) { closeLists(); continue; }

    // H1
    if (/^# /.test(trimmed)) {
      closeLists();
      html += '<h1>' + inlineFormat(trimmed.slice(2)) + '</h1>';
      continue;
    }
    // H2
    if (/^## /.test(trimmed)) {
      closeLists();
      html += '<h2>' + inlineFormat(trimmed.slice(3)) + '</h2>';
      continue;
    }
    // H3
    if (/^### /.test(trimmed)) {
      closeLists();
      html += '<h3>' + inlineFormat(trimmed.slice(4)) + '</h3>';
      continue;
    }

    // Blockquote
    if (/^> /.test(trimmed) || trimmed === '>') {
      if (!inBlockquote) { closeLists(); html += '<blockquote>'; inBlockquote = true; }
      const bqLine = trimmed.replace(/^>\s?/, '');
      html += (bqLine ? inlineFormat(bqLine) : '') + '<br>';
      continue;
    } else if (inBlockquote) {
      html += '</blockquote>'; inBlockquote = false;
    }

    // Unordered list
    if (/^[-*] /.test(trimmed)) {
      if (inOl) { html += '</ol>'; inOl = false; }
      if (!inUl) { html += '<ul>'; inUl = true; }
      html += '<li>' + inlineFormat(trimmed.slice(2)) + '</li>';
      continue;
    }
    // Ordered list
    if (/^\d+\.\s/.test(trimmed)) {
      if (inUl) { html += '</ul>'; inUl = false; }
      if (!inOl) { html += '<ol>'; inOl = true; }
      html += '<li>' + inlineFormat(trimmed.replace(/^\d+\.\s/, '')) + '</li>';
      continue;
    }

    // Paragraph
    closeLists();
    html += '<p>' + inlineFormat(trimmed) + '</p>';
  }
  closeLists();
  return html;
}

function renderModule(num) {
  state.currentModule = num;
  state.screen = 'course';
  saveState();

  const mod = MODULES[num - 1];
  const quiz = MODULE_QUIZZES.find(q => q.module_number === num);

  let html = renderMarkdown(mod.content);

  // Quiz section
  if (quiz && quiz.questions.length > 0) {
    html += '<div class="quiz-section"><h2>Knowledge Check</h2>';
    quiz.questions.forEach((q, qi) => {
      const qKey = `m${num}q${qi}`;
      const answered = state.quizAnswers[qKey] !== undefined;
      html += renderQuizQuestion(q, qKey, qi, answered);
    });
    html += '</div>';
  }

  // Survey Q5 after Module 3
  if (num === 3) {
    html += renderSurveyQ5();
  }

  // Survey Q6+Q7 after Module 5
  if (num === 5) {
    html += renderSurveyQ6Q7();
  }

  // Module complete message
  if (state.modulesComplete.includes(num)) {
    html += '<div class="module-complete-msg">✓ Module Complete</div>';
  }

  document.getElementById('courseContent').innerHTML = html;
  renderSidebar();
  document.getElementById('main').scrollTo(0, 0);
}

function renderQuizQuestion(q, qKey, idx, answered) {
  const selectedIdx = state.quizAnswers[qKey];
  let h = `<div class="quiz-card" id="card_${qKey}">`;
  h += `<div class="q-num">Question ${idx + 1} of 3</div>`;
  h += `<div class="q-text">${q.question_text}</div>`;
  h += `<div class="quiz-opts">`;

  q.options.forEach((opt, oi) => {
    let cls = 'quiz-opt';
    if (answered) {
      cls += ' disabled answered';
      if (opt.is_correct) cls += ' correct';
      else if (oi === selectedIdx) cls += ' incorrect';
    } else if (oi === selectedIdx) {
      cls += ' selected';
    }

    const marker = answered ? (opt.is_correct ? '✓' : (oi === selectedIdx ? '✗' : '')) : '';

    h += `<div class="${cls}" onclick="selectQuizOpt('${qKey}', ${oi}, this)" data-idx="${oi}">
      <div class="opt-marker">${marker}</div>
      <div>
        <div>${opt.text}</div>
        <div class="opt-explain">${opt.explanation}</div>
      </div>
    </div>`;
  });

  h += '</div>';
  if (!answered) {
    h += `<button class="btn btn-primary btn-check" onclick="checkAnswer('${qKey}', ${q.options.findIndex(o => o.is_correct)})" id="btn_${qKey}">Check Answer</button>`;
  }
  h += '</div>';
  return h;
}

function selectQuizOpt(qKey, idx, el) {
  if (state.quizAnswers[qKey] !== undefined) return; // already answered
  const card = document.getElementById('card_' + qKey);
  card.querySelectorAll('.quiz-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  // Store tentative selection
  state._tentative = state._tentative || {};
  state._tentative[qKey] = idx;
}

function checkAnswer(qKey, correctIdx) {
  const selected = (state._tentative && state._tentative[qKey] !== undefined) ? state._tentative[qKey] : -1;
  if (selected === -1) return;

  state.quizAnswers[qKey] = selected;
  saveState();

  // Re-render just this question card by re-rendering the module
  renderModule(state.currentModule);
  checkModuleCompletion(state.currentModule);

  // Scroll to the card
  setTimeout(() => {
    const card = document.getElementById('card_' + qKey);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function checkModuleCompletion(num) {
  const quiz = MODULE_QUIZZES.find(q => q.module_number === num);
  if (!quiz) return;

  const allAnswered = quiz.questions.every((q, qi) => state.quizAnswers[`m${num}q${qi}`] !== undefined);
  if (allAnswered && !state.modulesComplete.includes(num)) {
    // Check if survey questions for this module are done
    if (num === 3 && state.surveyQ5.length === 0) return; // need survey Q5 first
    if (num === 5 && !state.surveyQ7) return; // need survey Q6+Q7 first

    state.modulesComplete.push(num);
    state.modulesComplete.sort();
    saveState();
    renderSidebar();
    renderModule(num); // re-render to show complete message
  }
}

  if (state.surveyQ5.length > 0 || !isModuleQuizDone(3)) return '';
  const opts = ['Case Assessment','Discovery','Motion Practice','Depositions','Trial Prep','Appeals','Transactional Drafting','Due Diligence','Other'];
  return `
    <div class="survey-section" id="surveyQ5Section">
      <h2>Quick Question</h2>
      <p class="subtitle">Which of these AI use cases would be most valuable in your practice? (Select all that apply)</p>
      <div class="checkbox-group">
        ${opts.map(o => `<label class="checkbox-opt" onclick="toggleCheckbox(this)"><input type="checkbox" name="sq5" value="${o}"><span>${o}</span></label>`).join('')}
      </div>
      <button class="btn btn-primary" onclick="submitSurveyQ5()" style="margin-top:16px">Save &amp; Continue</button>
    </div>
  `;
}

async function submitSurveyQ5() {
  const checked = Array.from(document.querySelectorAll('input[name="sq5"]:checked')).map(e => e.value);
  if (checked.length === 0) return;
  state.surveyQ5 = checked;
  saveState();

  // Update Airtable
  if (state.surveyRecordId) {
    await airtableUpdate(TABLES.survey, state.surveyRecordId, {
      'Where is AI being used?': checked
    });
    showToast('Survey response saved ✓');
  }

  checkModuleCompletion(3);
  renderModule(3);
}

// ── Survey Q6+Q7 (after Module 5) ─────────────────────
function renderSurveyQ6Q7() {
  if (state.surveyQ7 || !isModuleQuizDone(5)) return '';
  const barriers = ['Cost','Governance risk','Lack of training','Cultural resistance','Data sensitivity','Client pushback'];
  const likelihood = ['Already using daily','Very likely','Somewhat likely','Unlikely','Need more training first'];
  return `
    <div class="survey-section" id="surveyQ67Section">
      <h2>Two Final Questions</h2>
      <p class="subtitle">Before your final assessment:</p>
      <div class="survey-q">
        <label class="q-label">What are your biggest barriers to AI adoption? <span style="font-weight:400;color:var(--text-light)">(select all that apply)</span></label>
        <div class="checkbox-group">
          ${barriers.map(b => `<label class="checkbox-opt" onclick="toggleCheckbox(this)"><input type="checkbox" name="sq6" value="${b}"><span>${b}</span></label>`).join('')}
        </div>
      </div>
      <div class="survey-q" style="margin-top:20px">
        <label class="q-label">How likely are you to start using AI in the next 30 days?</label>
        <div class="radio-group">
          ${likelihood.map(l => `<label class="radio-opt" onclick="this.querySelector('input').checked=true;highlightRadio(this)"><input type="radio" name="sq7" value="${l}"><span>${l}</span></label>`).join('')}
        </div>
      </div>
      <button class="btn btn-primary" onclick="submitSurveyQ67()" style="margin-top:20px">Continue to Final Assessment &rarr;</button>
    </div>
  `;
}

async function submitSurveyQ67() {
  const barriers = Array.from(document.querySelectorAll('input[name="sq6"]:checked')).map(e => e.value);
  const likelihoodEl = document.querySelector('input[name="sq7"]:checked');
  if (!likelihoodEl) return;

  state.surveyQ6 = barriers;
  state.surveyQ7 = likelihoodEl.value;
  saveState();

  // Update Airtable
  if (state.surveyRecordId) {
    const fields = { '30-Day Adoption Likelihood': state.surveyQ7 };
    if (barriers.length > 0) fields['Main barriers to adoption:'] = barriers;
    await airtableUpdate(TABLES.survey, state.surveyRecordId, fields);
    showToast('Survey response saved ✓');
  }

  checkModuleCompletion(5);
  renderModule(5);
}

function isModuleQuizDone(num) {
  const quiz = MODULE_QUIZZES.find(q => q.module_number === num);
  if (!quiz) return true;
  return quiz.questions.every((q, qi) => state.quizAnswers[`m${num}q${qi}`] !== undefined);
}

// ── Navigation ─────────────────────────────────────────
function navigateModule(num) {
  showScreen('course');
  renderModule(num);
  closeSidebarMobile();
}

function navigateAssessment() {
  if (state.modulesComplete.length < 5) {
    showToast('Complete all 5 modules first');
    return;
  }
  showScreen('assessment');
  renderAssessment();
  closeSidebarMobile();
}

function showScreen(name) {
  ['Welcome','Survey','Course','Assessment','Complete'].forEach(s => {
    document.getElementById('screen' + s).style.display = 'none';
  });
  const show = name.charAt(0).toUpperCase() + name.slice(1);
  document.getElementById('screen' + show).style.display = '';
  state.screen = name;
  saveState();

  // Show/hide sidebar
  const sidebar = document.getElementById('sidebar');
  const hamburger = document.getElementById('hamburger');
  if (name === 'welcome' || name === 'survey') {
    sidebar.style.display = 'none';
    hamburger.style.display = 'none';
    document.getElementById('main').style.marginLeft = '0';
  } else {
    sidebar.style.display = '';
    hamburger.style.display = '';
    if (window.innerWidth > 768) {
      document.getElementById('main').style.marginLeft = 'var(--sidebar-w)';
    }
  }
  renderSidebar();
}

// ── Final Assessment ───────────────────────────────────
function renderAssessment() {
  if (state.assessmentPassed) {
    renderComplete();
    showScreen('complete');
    return;
  }

  let html = `<div class="assessment-header">
    <h1>Final Assessment</h1>
    <div class="badge">10 questions &middot; 80% to pass</div>
  </div>`;

  FINAL_ASSESSMENT.forEach((q, qi) => {
    const qKey = `fa${qi}`;
    const answered = state.assessmentScore !== null;
    html += renderAssessmentQuestion(q, qKey, qi, answered);
  });

  if (state.assessmentScore !== null) {
    const pct = Math.round((state.assessmentScore / FINAL_ASSESSMENT.length) * 100);
    const pass = state.assessmentScore >= 8;
    html += `<div class="score-card">
      <div class="score-big ${pass ? 'pass' : 'fail'}">${state.assessmentScore}/${FINAL_ASSESSMENT.length}</div>
      <div class="score-label">${pct}% — ${pass ? 'Passed!' : 'Not yet. You need 80% to pass.'}</div>
    </div>`;
    if (pass) {
      html += renderCTA();
    } else {
      html += `<div style="text-align:center;margin:20px 0">
        <button class="btn btn-primary" onclick="retakeAssessment()">Retake Assessment</button>
      </div>`;
    }
  } else {
    html += `<div style="text-align:center;margin:32px 0">
      <button class="btn btn-gold btn-block" onclick="submitAssessment()" style="max-width:400px;margin:0 auto;font-size:1.05rem;padding:14px 32px">Submit Assessment</button>
    </div>`;
  }

  document.getElementById('assessmentContent').innerHTML = html;
  document.getElementById('main').scrollTo(0, 0);
}

function renderAssessmentQuestion(q, qKey, idx, showResults) {
  const selected = state.assessmentAnswers[qKey];
  let h = `<div class="quiz-card" id="card_${qKey}">`;
  h += `<div class="q-num">Question ${idx + 1} of ${FINAL_ASSESSMENT.length}</div>`;
  h += `<div class="q-text">${q.question_text}</div>`;
  h += `<div class="quiz-opts">`;

  q.options.forEach((opt, oi) => {
    let cls = 'quiz-opt';
    if (showResults) {
      cls += ' disabled answered';
      if (opt.is_correct) cls += ' correct';
      else if (oi === selected) cls += ' incorrect';
    } else {
      if (oi === selected) cls += ' selected';
    }

    const marker = showResults ? (opt.is_correct ? '✓' : (oi === selected && !opt.is_correct ? '✗' : '')) : '';

    h += `<div class="${cls}" onclick="selectAssessmentOpt('${qKey}', ${oi}, this)" data-idx="${oi}">
      <div class="opt-marker">${marker}</div>
      <div>
        <div>${opt.text}</div>
        <div class="opt-explain">${opt.explanation}</div>
      </div>
    </div>`;
  });

  h += '</div></div>';
  return h;
}

function selectAssessmentOpt(qKey, idx, el) {
  if (state.assessmentScore !== null) return;
  const card = document.getElementById('card_' + qKey);
  card.querySelectorAll('.quiz-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  state.assessmentAnswers[qKey] = idx;
  saveState();
}

function submitAssessment() {
  // Check all answered
  const total = FINAL_ASSESSMENT.length;
  const answeredCount = Object.keys(state.assessmentAnswers).length;
  if (answeredCount < total) {
    showToast(`Please answer all ${total} questions (${answeredCount}/${total} answered)`);
    return;
  }

  // Score
  let correct = 0;
  FINAL_ASSESSMENT.forEach((q, qi) => {
    const qKey = `fa${qi}`;
    const selected = state.assessmentAnswers[qKey];
    if (selected !== undefined && q.options[selected] && q.options[selected].is_correct) {
      correct++;
    }
  });

  state.assessmentScore = correct;
  state.assessmentPassed = correct >= 8;
  saveState();

  if (state.assessmentPassed) {
    renderComplete();
    showScreen('complete');
  } else {
    renderAssessment();
    document.getElementById('main').scrollTo(0, 0);
  }
  renderSidebar();
}

function retakeAssessment() {
  state.assessmentAnswers = {};
  state.assessmentScore = null;
  state.assessmentPassed = false;
  saveState();
  renderAssessment();
  document.getElementById('main').scrollTo(0, 0);
}

// ── CTA / Complete ─────────────────────────────────────
function renderCTA() {
  const shareText = encodeURIComponent("I just completed the AI for Lawyers minicourse from @TVPiInstitute. Highly recommend for any attorney getting started with AI. #legaltech #AIforLawyers");
  const shareUrl = encodeURIComponent("https://tvp-institute.com");
  return `
    <div class="cta-section">
      <h2>🎓 Congratulations!</h2>
      <p>You've completed <strong>AI for Lawyers: What You Need to Know Now</strong> and scored ${state.assessmentScore}/${FINAL_ASSESSMENT.length} on the final assessment.</p>
      <p>Ready to go deeper? Explore TVPi's full course catalog and the ALPP accreditation program.</p>
      <a href="https://tvp-institute.com" target="_blank" class="btn btn-gold" style="text-decoration:none">Explore TVPi Courses &rarr;</a>
      <div class="share-links" style="margin-top:24px">
        <a href="https://www.linkedin.com/sharing/share-offsite/?url=${shareUrl}" target="_blank" rel="noopener">🔗 Share on LinkedIn</a>
        <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" rel="noopener">𝕏 Share on X</a>
        <a href="mailto:?subject=AI for Lawyers - Free Course&body=I just completed this free AI course for lawyers from TVPi. Worth 30 minutes: https://tvp-institute.com" target="_blank">✉️ Email</a>
      </div>
    </div>
  `;
}

function renderComplete() {
  document.getElementById('completeContent').innerHTML = `
    <div style="text-align:center;padding-top:32px">
      <div style="font-size:4rem;margin-bottom:16px">🎓</div>
      <h1 style="color:var(--navy)">Course Complete</h1>
      <p style="color:var(--text-light);font-size:1.1rem;margin:8px 0 32px">You scored <strong>${state.assessmentScore}/${FINAL_ASSESSMENT.length}</strong> on the final assessment.</p>
    </div>
    ${renderCTA()}
    <div style="text-align:center;margin-top:32px">
      <button class="btn" style="background:transparent;color:var(--text-light);border:1px solid var(--border)" onclick="navigateModule(1)">← Review Course Modules</button>
    </div>
  `;
}

// ── Mobile Sidebar ─────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeSidebarMobile() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

// ── Initialize ─────────────────────────────────────────
function init() {
  const restored = loadState();

  renderWelcome();
  renderSurvey();
  renderSidebar();

  if (restored && state.screen) {
    if (state.assessmentPassed) {
      renderComplete();
      showScreen('complete');
    } else if (state.screen === 'assessment' && state.modulesComplete.length === 5) {
      showScreen('assessment');
      renderAssessment();
    } else if (state.surveyDone) {
      showScreen('course');
      renderModule(state.currentModule || 1);
    } else if (state.email) {
      showScreen('survey');
    } else {
      showScreen('welcome');
    }
  } else {
    showScreen('welcome');
  }
}

init();

</script>

</html>
